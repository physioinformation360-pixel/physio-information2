<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physio Information | Premium Physiotherapy Care</title>

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --royal-blue:#0b1c2d;
  --deep-blue:#081624;
  --gold:#d4af37;
  --soft-gold:#f3e5ab;
  --text-light:#e6edf5;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,var(--royal-blue),var(--deep-blue));
  color:var(--text-light);
  overflow-x:hidden;
}

/* ---------- HERO ---------- */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 20px;
  position:relative;
}

/* subtle luxury glow */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(212,175,55,.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(212,175,55,.06), transparent 40%);
  animation:float 12s infinite alternate ease-in-out;
}
@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(-40px)}
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:720px;
}

/* ---------- LOGO ---------- */
.logo-wrap{
  width:150px;
  height:150px;
  margin:0 auto 25px;
  border-radius:50%;
  background:radial-gradient(circle,var(--soft-gold),var(--gold));
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 60px rgba(212,175,55,.45);
}
.logo-wrap img{
  width:85%;
  height:85%;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:10px;
}

/* ---------- TEXT ---------- */
.hero h1{
  font-family:'Cinzel',serif;
  font-size:clamp(2.4rem,6vw,3.8rem);
  letter-spacing:2px;
  color:var(--gold);
  margin-bottom:10px;
}

.tagline{
  font-size:1.05rem;
  opacity:.9;
  margin-bottom:30px;
}

/* ---------- TRUST PILLS ---------- */
.trust{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:35px;
}

.trust span{
  padding:10px 18px;
  border-radius:30px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(212,175,55,.35);
  font-size:.85rem;
  backdrop-filter:blur(8px);
}

/* ---------- CTA ---------- */
.cta{
  display:inline-block;
  padding:16px 38px;
  border-radius:50px;
  background:linear-gradient(45deg,var(--gold),var(--soft-gold));
  color:#000;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 20px 60px rgba(212,175,55,.5);
  transition:.4s;
}
.cta:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 30px 80px rgba(212,175,55,.7);
}

/* ---------- WHATSAPP FLOAT ---------- */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:14px 22px;
  border-radius:50px;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 15px 40px rgba(37,211,102,.6);
  z-index:999;
}

/* ---------- MOBILE ---------- */
@media(max-width:600px){
  .logo-wrap{width:130px;height:130px}
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Physio Information Logo">
    </div>

    <!-- BRAND -->
    <h1>PHYSIO INFORMATION</h1>
    <p class="tagline">Better Than Before</p>

    <!-- TRUST SIGNALS -->
    <div class="trust">
      <span>✔ Evidence-Based Care</span>
      <span>✔ Clinical Expertise</span>
      <span>✔ Patient-Focused Recovery</span>
      <span>✔ Professional Physiotherapy</span>
    </div>

    <!-- CTA -->
    <a class="cta" href="https://wa.me/919600030932" target="_blank">
      Book Consultation
    </a>

  </div>
</section>

<a class="whatsapp" href="https://wa.me/919600030932" target="_blank">
  WhatsApp Now
</a>

</body>
</html>
